<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Coach | 雅思自动化学习教练</title>
    <link rel="stylesheet" href="style.css?v=1.0.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">🎯</span>
                <h1>IELTS Coach</h1>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-view="daily-plan">
                    <span class="icon">📅</span> 每日计划
                </button>
                <button class="nav-item" data-view="dashboard">
                    <span class="icon">📈</span> 目标追踪
                </button>
                <button class="nav-item" data-view="reading">
                    <span class="icon">📖</span> 阅读专项
                </button>
                <button class="nav-item" data-view="vocabulary">
                    <span class="icon">📚</span> 核心词汇
                </button>
                <button class="nav-item" data-view="grammar">
                    <span class="icon">🧩</span> 语法诊所
                </button>
                <button class="nav-item" data-view="phonetics">
                    <span class="icon">👄</span> 发音实验室
                </button>
                <button class="nav-item" data-view="writing">
                    <span class="icon">✍️</span> 零基础写作
                </button>
                <button class="nav-item" data-view="speaking">
                    <span class="icon">🗣️</span> 口语纠偏
                </button>
                <button class="nav-item" data-view="error-bank">
                    <span class="icon">📕</span> 错题库
                </button>
                <button class="nav-item" data-view="weekly-review">
                    <span class="icon">📊</span> 周度复盘
                </button>
                <div style="margin-top: auto; padding: 1rem 0; border-top: 1px solid var(--glass-border);">
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; font-size: 0.75rem; color: #4caf50; padding-left: 1.5rem;">
                        <span style="width: 8px; height: 8px; background: #4caf50; border-radius: 50%;"></span>
                        数据已实时保存
                    </div>
                    <div style="display: flex; gap: 0.5rem; padding: 0 1.5rem;">
                        <button onclick="exportData()" style="flex: 1; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 0.7rem;">💾 导出</button>
                        <button onclick="document.getElementById('import-file').click()" style="flex: 1; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 0.7rem;">📥 导入</button>
                        <input type="file" id="import-file" style="display: none;" onchange="importData(this)">
                    </div>
                </div>
            </nav>
            <div class="user-profile">
                <div class="avatar">J</div>
                <div class="user-info">
                    <span class="name">Jojo</span>
                    <span class="status">Level: A2 | 目标: 6.5</span>
                </div>
                <div class="progress-container" style="margin-top: 12px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid var(--glass-border);">
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 5px;">
                        <span>学习进度</span>
                        <span id="progress-percent">15%</span>
                    </div>
                    <div class="progress-bar-mini" style="width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">
                        <div id="progress-fill" style="width: 15%; height: 100%; background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary)); transition: width 0.5s ease;"></div>
                    </div>
                    <p id="dynamic-feedback" style="font-size: 0.7rem; color: var(--accent-secondary); margin-top: 8px; line-height: 1.4;">
                        起步阶段表现不错！今天建议重点攻克“一般现在时”。
                    </p>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="content">
            <header class="top-bar">
                <h2 id="view-title">每日计划</h2>
                <div class="date-display" id="current-date">2026年5月5日</div>
            </header>

            <div id="app-view" class="view-container">
                <!-- Content will be injected here by app.js -->
                <div class="loading">加载中...</div>
            </div>
        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="mobile-nav">
            <button class="nav-item active" data-view="daily-plan">
                <span class="icon">📅</span>
                <span>计划</span>
            </button>
            <button class="nav-item" data-view="dashboard">
                <span class="icon">📈</span>
                <span>进度</span>
            </button>
            <button class="nav-item" data-view="vocabulary">
                <span class="icon">📚</span>
                <span>词汇</span>
            </button>
            <button class="nav-item" data-view="writing">
                <span class="icon">✍️</span>
                <span>写作</span>
            </button>
            <button class="nav-item" data-view="error-bank">
                <span class="icon">📕</span>
                <span>错题</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
